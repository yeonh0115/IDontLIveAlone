spring.application.name=smart_door_security_server_test
spring.datasource.url=jdbc:h2:mem:smart-door-test;MODE=MySQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.storage-dir=${java.io.tmpdir}/smart-door-server-tests
FACE_WORKER_DEVICE_ID=door-camera-a
